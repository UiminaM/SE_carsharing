[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "aiokafka>=0.10,<1",
    "pyarrow>=15.0,<17",
    "boto3>=1.34,<2",
    "carsharing-common",
]

[tool.setuptools.packages.find]
include = ["app*"]
