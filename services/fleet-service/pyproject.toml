[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "cassandra-driver>=3.29,<4",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "carsharing-common",
]

[tool.setuptools.packages.find]
include = ["app*"]
