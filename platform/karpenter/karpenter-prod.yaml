---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: carsharing-workers
spec:
  template:
    metadata:
      labels:
        node-role: worker
        workload: carsharing
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: carsharing-default
      taints: []
      expireAfter: 720h
  limits:
    cpu: "32"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: carsharing-default
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: "KarpenterNodeRole-carsharing"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: carsharing
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: carsharing
  tags:
    Project: carsharing
    Owner: platform
