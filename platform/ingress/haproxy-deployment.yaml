apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: ingress
  labels: { app: haproxy, tier: edge }
spec:
  replicas: 2
  selector:
    matchLabels: { app: haproxy }
  template:
    metadata:
      labels: { app: haproxy }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8404"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: haproxy }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: haproxy
          image: haproxy:2.9-alpine
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - { name: http,   containerPort: 80 }
            - { name: stats,  containerPort: 8404 }
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          volumeMounts:
            - { name: cfg, mountPath: /usr/local/etc/haproxy }
      volumes:
        - name: cfg
          configMap: { name: haproxy-config }
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: ingress
spec:
  selector: { app: haproxy }
  type: NodePort
  ports:
    - { name: http,  port: 80,   targetPort: 80,   nodePort: 31080 }
    - { name: stats, port: 8404, targetPort: 8404, nodePort: 31084 }
