apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms.fullName" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
  selector: {{- include "ms.selectorLabels" . | nindent 4 }}
