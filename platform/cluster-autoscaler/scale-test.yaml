apiVersion: v1
kind: Namespace
metadata:
  name: autoscaler-demo
  labels:
    purpose: local-cluster-autoscaler-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pressure
  namespace: autoscaler-demo
  labels:
    app.kubernetes.io/name: worker-pressure
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-pressure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-pressure
    spec:
      nodeSelector:
        workload: carsharing
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "900m"
              memory: 64Mi
            limits:
              cpu: "900m"
              memory: 64Mi
