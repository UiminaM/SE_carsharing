apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UiminaM/SE_carsharing.git
    targetRevision: main
    path: platform/ci-cd/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: ci
  syncPolicy:
    automated: { prune: true, selfHeal: true }
