apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.20
    helm:
      releaseName: postgres
      values: |
        global:
          postgresql:
            auth:
              existingSecret: postgres-credentials
              secretKeys:
                userPasswordKey: POSTGRES_PASSWORD
                adminPasswordKey: POSTGRES_PASSWORD
        primary:
          persistence:
            size: 5Gi
        metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: mongodb
    targetRevision: 16.0.1
    helm:
      releaseName: mongodb
      values: |
        auth:
          enabled: false
        persistence:
          size: 5Gi
        metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: valkey
    targetRevision: 1.0.4
    helm:
      releaseName: valkey
      values: |
        architecture: standalone
        auth:
          enabled: false
        primary:
          persistence:
            size: 2Gi
        metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: cassandra
    targetRevision: 12.0.7
    helm:
      releaseName: cassandra
      values: |
        cluster:
          name: CarshareCluster
          replicaCount: 1
        persistence:
          size: 5Gi
        metrics:
          jmx:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 14.7.13
    helm:
      releaseName: minio
      values: |
        auth:
          existingSecret: minio-credentials
        defaultBuckets: "carsharing-archive"
        persistence:
          size: 10Gi
        metrics:
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
