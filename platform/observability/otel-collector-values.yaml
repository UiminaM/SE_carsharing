mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
    zipkin:
      endpoint: "0.0.0.0:9411"
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            static_configs:
              - targets: [ 'localhost:8888' ]

  processors:
    batch:
      timeout: 5s
      send_batch_size: 512
    memory_limiter:
      limit_mib: 400
      check_interval: 1s
    resource:
      attributes:
        - { key: cluster, value: carsharing, action: upsert }

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls: { insecure: true }
    prometheusremotewrite:
      endpoint: http://vminsert-vmcluster.observability.svc.cluster.local:8480/insert/0/prometheus/api/v1/write
      tls: { insecure: true }
    otlphttp/vlogs:
      endpoint: http://vlogs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
      tls: { insecure: true }

  service:
    pipelines:
      traces:
        receivers:  [otlp, zipkin]
        processors: [memory_limiter, resource, batch]
        exporters:  [otlp/tempo]
      metrics:
        receivers:  [otlp, prometheus]
        processors: [memory_limiter, resource, batch]
        exporters:  [prometheusremotewrite]
      logs:
        receivers:  [otlp]
        processors: [memory_limiter, resource, batch]
        exporters:  [otlphttp/vlogs]

ports:
  otlp: { enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP }
  otlphttp: { enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP }
  zipkin: { enabled: true, containerPort: 9411, servicePort: 9411, protocol: TCP }

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 1,    memory: 768Mi }
