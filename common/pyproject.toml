[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carsharing-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5,<3",
    "aiokafka>=0.10,<1",
    "redis>=5.0,<6",
    "structlog>=24.0,<25",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "httpx>=0.27,<1",
    "boto3>=1.34,<2",
]

[tool.setuptools.packages.find]
include = ["carsharing_common*"]
