x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carsharing
      POSTGRES_PASSWORD: carsharing
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/scripts/init-pg.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsharing"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: CarshareCluster
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 15s
      timeout: 10s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/scripts/create-topics.sh:/create-topics.sh
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BROKER: kafka:9092

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: carsharing
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/carsharing-archive &&
      mc anonymous set download local/carsharing-archive || true &&
      echo 'MinIO bucket ready.'
      "

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *common-env
      GW_REDIS_URL: redis://redis:6379/0
      GW_CAR_SERVICE_URL: http://car-service:8001
      GW_USER_SERVICE_URL: http://user-service:8002
      GW_TRIP_SERVICE_URL: http://trip-service:8003
      GW_FLEET_SERVICE_URL: http://fleet-service:8004
    ports:
      - "8010:8000"
    depends_on:
      redis:
        condition: service_healthy

  car-service:
    build:
      context: .
      dockerfile: services/car-service/Dockerfile
    environment:
      <<: *common-env
      CAR_POSTGRES_DSN: postgresql+asyncpg://carsharing:carsharing@postgres:5432/cars_db
      CAR_MONGO_URI: mongodb://mongodb:27017
      CAR_REDIS_URL: redis://redis:6379/0
      CAR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: *common-env
      USER_POSTGRES_DSN: postgresql+asyncpg://carsharing:carsharing@postgres:5432/users_db
      USER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    environment:
      <<: *common-env
      TRIP_POSTGRES_DSN: postgresql+asyncpg://carsharing:carsharing@postgres:5432/trips_db
      TRIP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRIP_S3_ENDPOINT_URL: http://minio:9000
      TRIP_S3_ACCESS_KEY: minioadmin
      TRIP_S3_SECRET_KEY: minioadmin
      TRIP_S3_BUCKET: carsharing-archive
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  fleet-service:
    build:
      context: .
      dockerfile: services/fleet-service/Dockerfile
    environment:
      <<: *common-env
      FLEET_CASSANDRA_HOSTS: cassandra
      FLEET_REDIS_URL: redis://redis:6379/0
      FLEET_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8004:8004"
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  archive-service:
    build:
      context: .
      dockerfile: services/archive-service/Dockerfile
    environment:
      <<: *common-env
      ARCHIVE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARCHIVE_S3_ENDPOINT_URL: http://minio:9000
      ARCHIVE_S3_ACCESS_KEY: minioadmin
      ARCHIVE_S3_SECRET_KEY: minioadmin
      ARCHIVE_S3_BUCKET: carsharing-archive
      ARCHIVE_FLUSH_MAX_RECORDS: "500"
      ARCHIVE_FLUSH_INTERVAL_SECONDS: "30"
    ports:
      - "8005:8005"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  cassandra_data:
  zk_data:
  kafka_data:
  minio_data:
